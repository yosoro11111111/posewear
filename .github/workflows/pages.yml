# 云端构建并发布 GitHub Pages：
# 1. 在 GitHub 的 runner 上抓取图库素材（原站下载，本仓库不含素材）
# 2. 以瘦身模式构建 dist（POSEWEAR_SLIM=1，无 o/ 原图，压回 Pages 1GB 上限内）
# 3. 发布到 GitHub Pages
#
# 注意：画图源 Flow2API 是 HTTP 地址，浏览器会拦截 HTTPS 页面对它的请求。
# 请在本仓库 Settings → Pages 关闭 Enforce HTTPS，然后用 http:// 地址访问本站。
name: Build & Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Fetch gallery assets (thumbs + medium)
        run: python -X utf8 scripts/fetch-assets.py --no-orig
      - name: Build dist (slim)
        run: python -X utf8 build.py
        env:
          POSEWEAR_SLIM: '1'
          POSEWEAR_SITE: ${{ vars.POSEWEAR_SITE || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare Pages 发布（仓库变量 CF_DEPLOY=1 时启用）：画图源是 HTTP，GitHub Pages 强制 HTTPS
  # 会拦截混合内容，需要经 Pages Functions 的 /api/proxy 转发，故正式站点部署在 Cloudflare Pages。
  deploy-cf:
    needs: build
    if: ${{ vars.CF_DEPLOY == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - name: Extract site (pages artifact is a zstd/gzip tar; auto-detect)
        run: |
          mkdir -p site
          f=$(find artifact -type f | head -1)
          echo "artifact file: $f"
          if echo "$f" | grep -q '\.zip$'; then
            unzip -q "$f" -d artifact/unz
            f=$(find artifact/unz -type f | head -1)
            echo "inner file: $f"
          fi
          tar -I unzstd -xf "$f" -C site 2>/dev/null || tar -xf "$f" -C site
          echo "site contents:"; ls site | head -5
      - name: Inject server-side paint config (from Secrets, never committed)
        run: |
          cat > functions/api/paint.config.js <<'HEADER'
          // 由 CI 生成（.gitignore 忽略）：画图上游地址、密钥与口令，只存在于部署产物
          HEADER
          cat >> functions/api/paint.config.js <<EOF
          export const F2A_BASE = '${F2A_BASE}';
          export const F2A_KEY = '${F2A_KEY}';
          export const PAINT_PASS = '${PAINT_PASS}';
          EOF
        env:
          F2A_BASE: ${{ secrets.F2A_BASE }}
          F2A_KEY: ${{ secrets.F2A_KEY }}
          PAINT_PASS: ${{ secrets.PAINT_PASS }}
      - name: Deploy to Cloudflare Pages (with /api proxy function)
        run: npx wrangler@4 pages deploy site --project-name "$CF_PROJECT" --branch main --commit-dirty true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT || 'posewear' }}
